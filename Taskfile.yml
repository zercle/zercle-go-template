version: '3'

# NOTE: dotenv is deliberately per-task, not global. A global dotenv would
# export APP_ENVIRONMENT/DB_* etc. into `task test`, and viper's env binding then
# overrides the config values the unit tests assert on — the quick start's
# `cp .env.example .env` would leave the default test command permanently red.
vars:
  BIN_DIR: bin
  COVERAGE_OUT: coverage.out
  GIT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_TIME:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ

tasks:
  build:
    desc: Build the server binary
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -ldflags="-s -w -X main.Version={{.GIT_VERSION | default "dev"}} -X main.CommitSHA={{.GIT_COMMIT | default "unknown"}} -X main.BuildTime={{.BUILD_TIME | default "unknown"}}" -o {{.BIN_DIR}}/server ./cmd/server

  run:
    desc: Run the server locally
    dotenv: ['.env']
    deps: [build]
    cmds:
      - ./{{.BIN_DIR}}/server

  test:
    desc: Run all tests (default unit tag)
    cmds:
      - task: test-unit

  test-unit:
    desc: Run unit tests only
    cmds:
      - go test -race -tags=unit -coverprofile={{.COVERAGE_OUT}} -coverpkg=./internal/...,./pkg/... ./internal/... ./pkg/...

  test-integration:
    desc: Run integration tests (requires postgres + valkey)
    dotenv: ['.env']
    cmds:
      # -p 1: integration suites share one database and TRUNCATE each other's
      # tables in SetupTest, so package binaries must not run in parallel.
      - go test -v -race -tags=integration -p 1 ./...

  test-e2e:
    desc: Run end-to-end tests (boots full server)
    dotenv: ['.env']
    cmds:
      - go test -v -race -tags=e2e ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --timeout=5m ./...

  fmt:
    desc: Format Go source
    cmds:
      - gofumpt -w cmd internal pkg test
      - goimports -w cmd internal pkg test

  tidy:
    desc: Tidy go.mod and verify
    cmds:
      - go mod tidy
      - go mod verify

  verify:
    desc: Verify module state and no diff
    cmds:
      - task: tidy
      - git diff --exit-code go.mod go.sum

  generate:
    desc: Generate mocks (task generate after changing the repository interface)
    cmds:
      - go generate ./...


  migrate-up:
    desc: Run database migrations (self-contained runner; merges every registered feature's embedded migrations via the registry)
    dotenv: [".env"]
    cmds:
      - go run ./cmd/migrate up

  migrate-down:
    desc: Rollback N database migrations with the self-contained runner (default 1)
    dotenv: [".env"]
    cmds:
      - go run ./cmd/migrate down {{.N | default 1}}

  migrate-create:
    desc: "Create a new migration in a feature: task migrate-create FEATURE=catalog NAME=add_users (FEATURE = internal/features/<FEATURE>/repository/postgres/migrations)"
    dotenv: [".env"]
    cmds:
      - migrate create -ext sql -dir internal/features/{{.FEATURE}}/repository/postgres/migrations {{.NAME}}

  docker-build:
    desc: Build server container image
    cmds:
      - docker build -f Containerfile -t zercle-go-template:latest .

  cover-html:
    desc: Render coverage report to HTML
    cmds:
      - go tool cover -html={{.COVERAGE_OUT}} -o coverage.html
